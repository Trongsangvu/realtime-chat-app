name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      YARN_NODE_LINKER: node-modules

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test
        run: yarn test --watchAll=false
        env:
          CI: "true"

      - name: Build
        run: yarn build
        env:
          CI: "false" # CRA treats lint warnings as errors when CI=true

  backend:
    name: ${{ matrix.package }} (build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [server, peerjs]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    env:
      YARN_NODE_LINKER: node-modules

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ${{ matrix.package }}/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build
