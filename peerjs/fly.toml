app = "realtime-chat-peer"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "9000"

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
